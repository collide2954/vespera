[workspace]
resolver = "3"
members = [
    "crates/vespera",
    "crates/vespera_client",
    "crates/vespera_content",
    "crates/vespera_core",
    "crates/vespera_motion",
    "crates/vespera_protocol",
    "crates/vespera_render",
    "crates/vespera_rules",
    "crates/vespera_server",
    "crates/vespera_testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/collide2954/vespera"
publish = false

[workspace.dependencies]
vespera_client = { path = "crates/vespera_client" }
vespera_content = { path = "crates/vespera_content" }
vespera_core = { path = "crates/vespera_core" }
vespera_motion = { path = "crates/vespera_motion" }
vespera_protocol = { path = "crates/vespera_protocol" }
vespera_render = { path = "crates/vespera_render" }
vespera_rules = { path = "crates/vespera_rules" }
vespera_server = { path = "crates/vespera_server" }

anyhow = "1.0.104"
bevy = { version = "0.20.1", default-features = false, features = [
    "async_executor",
    "bevy_state",
    "multi_threaded",
    "serialize",
    "std",
] }
bevy_replicon = { version = "0.45.5", default-features = false }
bevy_replicon_renet = { version = "0.21.0", default-features = false, features = [
    "renet_netcode",
] }
ra-ap-rustc_lexer = "0.184.0"
ron = "0.12.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
toml = "0.9.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
type_complexity = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
