[workspace]
resolver = "3"
members = ["xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/collide2954/vespera"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
ra-ap-rustc_lexer = "0.184.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "0.9.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
