[workspace]
resolver = "3"
members = [
    "crates/vespera_client",
    "crates/vespera_rules",
    "crates/vespera_server",
    "crates/vespera_testkit",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
repository = "https://github.com/collide2954/vespera"
publish = false

[workspace.dependencies]
vespera_client = { path = "crates/vespera_client" }
vespera_server = { path = "crates/vespera_server" }

anyhow = "1.0.104"
bevy = { version = "0.20.1", default-features = false, features = [
    "async_executor",
    "bevy_state",
    "multi_threaded",
    "std",
] }
bevy_replicon = { version = "0.45.5", default-features = false }
ra-ap-rustc_lexer = "0.184.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "0.9.8"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
unwrap_used = "deny"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
