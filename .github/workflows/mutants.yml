name: Mutation tests

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  mutants:
    name: Mutation tests
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants,cargo-nextest
      - run: cargo mutants --workspace --test-tool nextest
        continue-on-error: true
      - if: always()
        run: |
          echo "## Surviving mutants" >> "$GITHUB_STEP_SUMMARY"
          cat mutants.out/missed.txt >> "$GITHUB_STEP_SUMMARY" || echo "None" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants
          path: mutants.out
